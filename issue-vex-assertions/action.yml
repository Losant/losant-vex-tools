name: VEX Assertions Updater
description: >
  Processes recently closed vex-pending issues in the current repository,
  updates CSAF VEX documents, triggers a Cloud Run Job to reload VEX into
  Container Analysis, and labels processed issues as vex-reflected.

inputs:
  vex_repo:
    description: >
      Repository where CSAF VEX files are stored (owner/repo).
      The GITHUB_TOKEN or VEX_GITHUB_TOKEN env var must have write access to this repo.
    required: true
  timeout_minutes:
    description: >
      Expected max runtime of this action in minutes. The look-back window for
      closed issues is timeout + 1 minute, so reruns within this window will
      still pick up any issues closed since the previous attempt.
      Set job timeout-minutes in your workflow to this same value.
    default: '360'
  gcp_project:
    description: >
      GCP project ID. If omitted (along with cloud_run_job and cloud_run_region),
      the Cloud Run Job trigger is skipped.
    required: false
  cloud_run_job:
    description: Cloud Run Job name to trigger with LOAD_ONLY=true after VEX files are updated.
    required: false
  cloud_run_region:
    description: Cloud Run region where the Cloud Run Job is deployed.
    required: false

# Required environment variables (set in your workflow's env or step env):
#   GITHUB_TOKEN      - token with issues:write on the current (issues) repo
#   VEX_GITHUB_TOKEN  - token with contents:write on vex_repo; falls back to GITHUB_TOKEN

runs:
  using: node24
  main: dist/index.js
