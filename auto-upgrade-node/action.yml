name: Upgrade Node.js
description: >
  Keeps Node.js, pnpm, and dependencies current. Upgrades Node.js and pnpm independently
  across Dockerfiles, package.json engines, and .node-version, then always finishes with
  a recursive dependency upgrade. Falls back progressively when an upgrade fails.

inputs:
  node_major_version:
    description: Node.js major version to check for upgrades (e.g. "24")
    required: true
  project_dirs:
    description: >
      Comma-separated, repo-relative directories, each treated as its own pnpm project
      root. `pnpm install` and the final `pnpm -r up` run in each of these in addition to
      the repository root. Example: "packages/api,tools/cli".
    required: false
    default: ''
  upgrade_to_latest:
    description: >
      Set to "true" to run the final dependency upgrade as `pnpm -r up --latest`, allowing
      major-version bumps. Defaults to `pnpm -r up`, which stays within the semver ranges
      already declared in package.json.
    required: false
    default: 'false'

outputs:
  current_node:
    description: Node.js version found in .node-version before the upgrade
  current_pnpm:
    description: pnpm version found in package.json before the upgrade
  new_node_version:
    description: New Node.js version if Node was upgraded, empty string if it was already current
  new_pnpm:
    description: >
      New pnpm version if pnpm was upgraded, empty string otherwise. Reachable without a
      Node.js upgrade, since the two are independent.
  notes:
    description: >
      Markdown warnings or errors from failed attempts, including dependency upgrade
      failures; empty on clean success
  has_changes:
    description: >
      "true" when the run left uncommitted changes in the working tree, "false" otherwise.
      Gate pull request creation on this rather than on new_node_version, since
      dependency-only upgrades change files without changing the Node.js version.

runs:
  using: node24
  main: dist/index.js
